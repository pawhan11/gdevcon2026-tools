name: create-ni-docker-builder-2025-q3

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ctc-windows-2025-large
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        shell: powershell
        env:
          TS_SERIALNUMBER: ${{ secrets.TESTSTAND_SN }}
        run: docker build --build-arg SERIALNUMBER=$env:TS_SERIALNUMBER -t ghcr.io/convertertec/ni-docker-builder:2025-q3 -f .\dockerfiles\ni-docker-builder-2025-q3.yml .

      - name: Push to ghcr
        run: docker push ghcr.io/convertertec/ni-docker-builder:2025-q3
